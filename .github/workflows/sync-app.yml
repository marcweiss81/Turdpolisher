# Copies the TurdPolisher app files (including binary icons) from the
# development repo (marcweiss81/Claude, turdpolisher/ subfolder) into this
# GitHub Pages repo. Run it manually from the Actions tab (or via API)
# after changes merge in the dev repo.
name: Sync app from dev repo
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy app files from marcweiss81/Claude turdpolisher/
        run: |
          git clone --depth 1 https://github.com/marcweiss81/Claude /tmp/dev
          cp /tmp/dev/turdpolisher/index.html \
             /tmp/dev/turdpolisher/README.md \
             /tmp/dev/turdpolisher/manifest.webmanifest \
             /tmp/dev/turdpolisher/sw.js .
          mkdir -p icons
          cp /tmp/dev/turdpolisher/icons/*.png icons/
          rm -f appletouchicon.png
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync app files from marcweiss81/Claude turdpolisher/"
          git push
